[project]
name = "lorehaven"
version = "0.1.0"
description = "Lorehaven pricing analysis and simulator"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
